# Enable mouse support
set -g mouse on
# Enable Clipboard passthrough
set -g set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Navigate windows with Shift+Alt+h and Shift+Alt+l
bind -n M-H previous-window
bind -n M-L next-window

# Enable 24-bit color support
#set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"

# Vi mode
set-window-option -g mode-keys vi

# Vim-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open splits in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Color customization
# Two-tone scheme used consistently for window tabs and pane borders:
#   primary   #00afff (blue)  = active / highlighted
#   secondary #0087af (dim blue) = inactive tabs, #8a8a8a (grey) = inactive borders
set -g status-style 'bg=default'
set -g status-left-style 'fg=#00afff,bg=#303030'
set -g status-right-style 'fg=#00afff,bg=#303030'
set -g window-status-current-style 'fg=#00afff,bg=#303030,bold'
set -g window-status-style 'fg=#0087af,bg=#303030'
set -g window-status-separator ' '
set -g status-justify centre

# Pane borders (tmux defaults to a green active border)
set -g pane-border-style 'fg=#8a8a8a'
set -g pane-active-border-style 'fg=#00afff'

# Copy-mode selection and message prompts (tmux defaults to yellow)
set -g mode-style 'fg=#303030,bg=#00afff'
set -g message-style 'fg=#00afff,bg=#303030'
set -g message-command-style 'fg=#00afff,bg=#303030'

# Window status format
set -g window-status-format "#[fg=#303030,bg=terminal]\ue0b6#[fg=#0087af,bg=#303030] #I [#{pane_current_command}]#{?window_zoomed_flag, Z,} #[fg=#303030,bg=terminal]\ue0b4"
set -g window-status-current-format "#[fg=#303030,bg=terminal]\ue0b6#[fg=#00afff,bg=#303030,bold] #I [#{pane_current_command}]#{?window_zoomed_flag, Z,} #[fg=#303030,bg=terminal]\ue0b4"

## PLUGIN CONFIG!!!

# Mode Indicatior
set -g status-left "#[fg=#303030,bg=terminal]\ue0b6#[fg=#00afff,bg=#303030] %Y-%m-%d %H:%M #{tmux_mode_indicator} #[fg=#303030,bg=terminal]\ue0b4"

set -g status-interval 2
set -g @sysstat_mem_view_tmpl '#{mem.used}/#{mem.total}'
set -g @sysstat_cpu_view_tmpl '#{cpu.pused}'
set -g status-right "#[fg=#303030,bg=terminal]\ue0b6#[fg=#00afff,bg=#303030] #{sysstat_cpu} | #{sysstat_loadavg} | #{sysstat_mem} #[fg=#303030,bg=terminal]\ue0b4"
set -g status-left-length 100

# Floating scratch pane (floax)
set -g @floax-bind 'p'
set -g @floax-bind-menu 'P'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#00afff'
set -g @floax-text-color '#00afff'
set -g @floax-session-name 'scratch'
set -g @floax-title 'scratch'
set -g @floax-change-path 'true'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'omerxx/tmux-floax'

# Set default shell
set -g default-shell /bin/zsh

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
