---
- name: Install and configure ZSH, tmux, Zap, and Powerlevel10k
  hosts: all
  become: true
  vars:
    target_user: "{{ ansible_user | default(lookup('env', 'SUDO_USER'), true) | default(lookup('env', 'USER'), true) }}"
    user_home: "/home/{{ target_user }}"
    supported_os_families:
      - Debian
      - RedHat
    packages:
      common:
        - zsh
        - tmux
        - fzf
        - bat
        - tig
        - neovim
        - git
        - curl
        - wget
        - unzip
        - fontconfig
        - cmake
        - rsync
        - ncurses-term
      Debian:
        - g++
        - locales
      RedHat:
        - gcc-c++
        #language Packages
        - glibc-langpack-en
        - glibc-langpack-de

  tasks:
    - name: Check if OS family is supported
      fail:
        msg: "This playbook only supports Debian and RedHat OS families. Detected: {{ ansible_facts['os_family'] }}"
      when: ansible_facts['os_family'] not in supported_os_families

    - name: Generates Ubuntu locales (en_US.UTF-8 and de_DE.UTF-8)
      shell: locale-gen en_US.UTF-8 de_DE.UTF-8
      when: ansible_facts['os_family'] == "Debian"
      changed_when: true

    - name: Install common packages
      package:
        name: "{{ packages.common }}"
        state: present

    - name: Install OS-specific packages
      package:
        name: "{{ packages[ansible_facts['os_family']] }}"
        state: present

    - name: Check if Zap is installed
      stat:
        path: "{{ user_home }}/.local/share/zap"
      register: zap_installed

    - name: Install Zap plugin manager
      shell: >
        zsh -c "$(curl -s https://raw.githubusercontent.com/zap-zsh/zap/master/install.zsh)
        --branch release-v1 --keep-zshrc"
      when: not zap_installed.stat.exists
      changed_when: true
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ user_home }}"

    - name: Create fonts directory
      file:
        path: "{{ user_home }}/.local/share/fonts/menslo-nerdfonts"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    # No delegate_to here: synchronize already runs rsync on the controller and
    # pushes to the inventory host. Delegating to localhost would make localhost
    # the destination too, so remote hosts would never receive the fonts.
    - name: Copy font files
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/menslo-nerdfonts/"
        dest: "{{ user_home }}/.local/share/fonts/menslo-nerdfonts/"
        times: yes
        delete: no
        recursive: yes
        archive: no
        checksum: yes
      become: false
      register: fonts_copied

    - name: Ensure fonts are owned by the target user
      file:
        path: "{{ user_home }}/.local/share/fonts/menslo-nerdfonts"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        recurse: yes
      when: fonts_copied.changed

    - name: Update font cache
      shell: fc-cache -fv
      become_user: "{{ target_user }}"
      environment:
        HOME: "{{ user_home }}"
      when: fonts_copied.changed

    - name: Copy .zshrc configuration
      template:
        src: .zshrc
        dest: "{{ user_home }}/.zshrc"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Copy .p10k.zsh configuration
      copy:
        src: .p10k.zsh
        dest: "{{ user_home }}/.p10k.zsh"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'

    - name: Create tmux plugins directory
      file:
        path: "{{ user_home }}/.tmux/plugins"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    - name: Check if tmux plugin manager is installed
      stat:
        path: "{{ user_home }}/.tmux/plugins/tpm"
      register: tpm_installed

    - name: Clone tmux plugin manager
      git:
        repo: 'https://github.com/tmux-plugins/tpm'
        dest: "{{ user_home }}/.tmux/plugins/tpm"
        version: master
        accept_hostkey: yes
      become_user: "{{ target_user }}"
      when: not tpm_installed.stat.exists

    - name: Copy tmux configuration
      copy:
        src: .tmux.conf
        dest: "{{ user_home }}/.tmux.conf"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'
